<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Morano — Novo compromisso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;border:0;cursor:pointer;padding:0;color:inherit}
input{font-family:inherit;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;font-family:'DM Sans',system-ui,sans-serif;background:radial-gradient(380px 300px at 100% 0%, var(--glow), transparent 70%), var(--bg);color:var(--ink);{{vars}}">
<div style="display:flex;flex-direction:column;padding:16px 20px 0;transform:translateY({{offY}}px)">
<div style="display:flex;align-items:center;gap:10px;height:44px"><div style="flex:1;font-size:22px;font-weight:400;letter-spacing:-0.4px">Novo compromisso</div><button aria-label="Fechar" style="position:relative;width:40px;height:40px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div style="margin-top:14px;font-size:12px;font-weight:500;color:var(--mute)">Tipo</div>
<div style="margin-top:6px;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px">
<button aria-pressed="true" style="height:76px;border-radius:14px;background:#F3D2D8;border:1.5px solid #C25B6E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#2A1B12"><span style="width:34px;height:34px;border-radius:17px;background:#FFFAF4;color:#C25B6E;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v7M3 20h18M5 16c2 1.5 3.5 1.5 5 0s3.5-1.5 5 0 3 1 4 0M12 12V9M12 7c-.8 0-1.2-.8-1.2-1.5S12 3.5 12 3.5s1.2 1.3 1.2 2S12.8 7 12 7z"></path></svg></span><span style="font-size:12px;font-weight:600">Aniversário</span></button>
<button aria-pressed="false" style="height:76px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px"><span style="width:34px;height:34px;border-radius:17px;background:#F6DDB9;color:#2A1B12;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-3 0-5 2.5-5 5.5S9 14 12 14s5-2.5 5-5.5S15 3 12 3zM12 14v2.5M10.5 17.5h3M12 17.5V21"></path></svg></span><span style="font-size:12px;font-weight:500">Festa</span></button>
<button aria-pressed="false" style="height:76px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px"><span style="width:34px;height:34px;border-radius:17px;background:#D5DEEA;color:#2A1B12;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4M9.5 15l2 2 3.5-3.5"></path></svg></span><span style="font-size:12px;font-weight:500">Compromisso</span></button>
<button aria-pressed="false" style="height:76px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px"><span style="width:34px;height:34px;border-radius:17px;background:#F5E4D2;color:#2A1B12;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.3"></circle><circle cx="12" cy="12" r="1.3"></circle><circle cx="18" cy="12" r="1.3"></circle></svg></span><span style="font-size:12px;font-weight:500">Outro</span></button>
</div>
<div style="margin-top:14px"><div style="flex:1;min-width:0"><label for="f-nome" style="display:block;font-size:12px;font-weight:500;color:var(--mute)">Nome</label><div style="margin-top:6px;height:46px;box-sizing:border-box;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px"><input id="f-nome" type="text" value="Aniversário do Lucas" style="flex:1;min-width:0;height:40px;border:0;outline:0;background:transparent;font-size:14.5px;font-weight:500;padding:0"></div></div></div>
<div style="margin-top:12px;display:flex;gap:10px"><div style="flex:1;min-width:0"><label for="f-data" style="display:block;font-size:12px;font-weight:500;color:var(--mute)">Data</label><div style="margin-top:6px;height:46px;box-sizing:border-box;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px"><input id="f-data" type="text" value="Sáb, 28 nov" style="flex:1;min-width:0;height:40px;border:0;outline:0;background:transparent;font-size:14.5px;font-weight:500;padding:0"><span style="color:var(--mute);display:flex"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></span></div></div><div style="flex:1;min-width:0"><label for="f-hora" style="display:block;font-size:12px;font-weight:500;color:var(--mute)">Hora</label><div style="margin-top:6px;height:46px;box-sizing:border-box;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px"><input id="f-hora" type="text" value="19:00" style="flex:1;min-width:0;height:40px;border:0;outline:0;background:transparent;font-size:14.5px;font-weight:500;padding:0"><span style="color:var(--mute);display:flex"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span></div></div></div>
<div style="margin-top:12px"><div style="flex:1;min-width:0"><label for="f-local" style="display:block;font-size:12px;font-weight:500;color:var(--mute)">Local (opcional)</label><div style="margin-top:6px;height:46px;box-sizing:border-box;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px"><input id="f-local" type="text" value="Casa" style="flex:1;min-width:0;height:40px;border:0;outline:0;background:transparent;font-size:14.5px;font-weight:500;padding:0"><span style="color:var(--mute);display:flex"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s6-5.5 6-11a6 6 0 0 0-12 0c0 5.5 6 11 6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg></span></div></div></div>
<div style="margin-top:14px;font-size:12px;font-weight:500;color:var(--mute)">Quem participa</div>
<div style="margin-top:6px;display:flex;gap:14px;align-items:flex-start">
<button aria-pressed="true" aria-label="Rafael, participa" style="position:relative;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--ink)"><span style="position:relative;width:46px;height:46px;border-radius:23px;background:#EBD5BE;color:#6B3A17;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)">R<span style="position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></span><span>Rafael</span></button>
<button aria-pressed="true" aria-label="Ana, participa" style="position:relative;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--ink)"><span style="position:relative;width:46px;height:46px;border-radius:23px;background:#F3CFCF;color:#8A2F3A;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)">A<span style="position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></span><span>Ana</span></button>
<button aria-pressed="true" aria-label="Lucas, participa" style="position:relative;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--ink)"><span style="position:relative;width:46px;height:46px;border-radius:23px;background:#D5DEEA;color:#2C4A6E;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)">L<span style="position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></span><span>Lucas</span></button>
<button aria-label="Adicionar convidado" style="background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--mute)"><span style="width:46px;height:46px;border-radius:23px;border:1.5px dashed var(--mute);display:flex;align-items:center;justify-content:center;color:var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span><span>Convidado</span></button>
</div>
<div style="margin-top:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden"><div style="height:56px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);"><div style="width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3M20 5H8a4 4 0 0 0-4 4v1M7 22l-3-3 3-3M4 19h12a4 4 0 0 0 4-4v-1"></path></svg></div><div style="flex:1"><div style="font-size:14px;font-weight:500">Repetir todo ano</div><div style="font-size:12px;color:var(--mute)">Ideal para aniversários</div></div><button role="switch" aria-checked="true" aria-label="Repetir todo ano" style="width:44px;height:26px;border-radius:13px;background:var(--navActive);display:flex;align-items:center;justify-content:flex-end;padding:0 3px;flex:none"><span style="width:20px;height:20px;border-radius:10px;background:var(--navActiveInk)"></span></button></div><div style="height:56px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px;"><div style="width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"></path><path d="M10 19a2 2 0 0 0 4 0M3 4l2 2M21 4l-2 2"></path></svg></div><div style="flex:1"><div style="font-size:14px;font-weight:500">Lembrete</div><div style="font-size:12px;color:var(--mute)">1 dia antes, às 9h</div></div><button role="switch" aria-checked="true" aria-label="Lembrete" style="width:44px;height:26px;border-radius:13px;background:var(--navActive);display:flex;align-items:center;justify-content:flex-end;padding:0 3px;flex:none"><span style="width:20px;height:20px;border-radius:10px;background:var(--navActiveInk)"></span></button></div></div>
</div>
<button style="position:absolute;left:20px;right:20px;bottom:24px;height:48px;border-radius:12px;background:var(--ink);color:var(--card);font-size:14.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Salvar compromisso</span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Aparência"},"scroll":{"editor":"int","default":0,"min":0,"max":420,"section":"Rolagem"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
const scroll = Number(this.props.scroll ?? 0);
const light = '--bg:#FBF0E4;--glow:rgba(240,184,128,0.30);--card:#FFFAF4;--card2:#F5E4D2;--ink:#2A1B12;--mute:#725E4F;--line:rgba(110,70,35,0.12);--shadow:0 1px 2px rgba(90,55,25,0.05),0 6px 18px rgba(90,55,25,0.06);--heroA:#4B3527;--heroB:#2B1E16;--warnBg:#F7DCCB;--warnInk:#7E3417;--warnIcon:#EFBFA3;--navBg:rgba(255,250,244,0.88);--navItem:#F5E4D2;--navActive:#2A1B12;--navActiveInk:#FBEFE3;';
const night = '--bg:#1C130E;--glow:rgba(214,140,75,0.26);--card:#2A1D15;--card2:#37271C;--ink:#F6E9DB;--mute:#BDA894;--line:rgba(246,233,219,0.10);--shadow:none;--heroA:#6A4A34;--heroB:#3C2A1E;--warnBg:#43251A;--warnInk:#FFC3A0;--warnIcon:#66361F;--navBg:rgba(52,37,28,0.90);--navItem:#402E22;--navActive:#F6E9DB;--navActiveInk:#2A1B12;';
return { vars: dark ? night : light, offY: -scroll };
}
}
</script>
</body>
</html>
