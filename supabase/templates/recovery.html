<!-- Link de recuperação de senha. RedirectTo = redirectTo do resetPasswordForEmail (`<site>/auth/confirm?next=/redefinir-senha`, já com query). -->
<h2>Redefina sua senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta no MORANO.</p>
<p>
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery">Criar uma nova senha</a>
</p>
<p>Se você não pediu, ignore este e-mail. Sua senha continua a mesma.</p>
